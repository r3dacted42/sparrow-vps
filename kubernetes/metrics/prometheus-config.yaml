apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'deploy-service'
        static_configs:
          - targets: ['deploy-service-svc.sparrow-vps:8002'] 
      - job_name: 'container-service'
        static_configs:
          - targets: ['container-service-svc.sparrow-vps:8001']
